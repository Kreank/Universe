# nginx-Config fuer das Angular-Frontend (im frontend-Container).
# Serviert die SPA und proxyt /api + /ws an den game-server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Routing: alles auf index.html zurueckfallen lassen
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST-API an den game-server weiterleiten
    location /api/ {
        proxy_pass http://game-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket an den game-server
    location /ws {
        proxy_pass http://game-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
