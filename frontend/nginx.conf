# nginx-Config fuer das Angular-Frontend (im frontend-Container).
# Serviert die SPA und proxyt /api + /ws an den game-server.
# Inhaltlich identisch zu infra/nginx/nginx.conf (dort als Vorlage gepflegt).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA: Manifest mit korrektem MIME ausliefern
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # PWA: Service-Worker-Steuerdateien NIE cachen, sonst bleiben Clients
    # auf einer alten Version haengen. ngsw verteilt Updates ueber ngsw.json.
    location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # index.html ebenfalls frisch halten (App-Shell-Einstieg)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-Routing: alles auf index.html zurueckfallen lassen
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST-API an den game-server weiterleiten
    location /api/ {
        proxy_pass http://game-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket an den game-server
    location /ws {
        proxy_pass http://game-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
