name: lint

# Durable Guard: ruff pyflakes-F-Klasse auf jedem Push/PR. Faengt Undefined-Name /
# Use-before-Assignment (F821/F823) automatisch — die Klasse, die die Loop-Breaker
# #1/#12 unbemerkt live brachte (die Tests decken die DB-Pfade nicht ab).
on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.17
      - run: ruff check backend/app --select F
